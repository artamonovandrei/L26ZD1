name: Advanced CI/CD Workflow

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  APP_NAME: devops-app
  PYTHON_VERSION: '3.11'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Instalacja Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Zbuduj artefakt
        run: |
          exit 1
          mkdir -p dist
          echo "App: ${{ env.APP_NAME }}" > dist/build-info.txt
          echo "Version: 1.0.0" >> dist/build-info.txt
          echo "Commit: ${{ github.sha }}" >> dist/build-info.txt
          echo "Branch: ${{ github.ref_name }}" >> dist/build-info.txt
          echo "Build time: $(date)" >> dist/build-info.txt
          cat dist/build-info.txt

      - name: Zapisz artefakt
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist/

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Instalacja Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalacja zależności
        run: pip install pytest pytest-cov

      - name: Uruchom testy
        run: pytest --cov=. --cov-report=term

      - name: Wyniki testów
        if: always()
        run: |
          echo "=== Test Result ==="
          echo "Status: ${{ job.status }}"
          echo "Branch: ${{ github.ref_name }}"

  deploy:
    needs: [build, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Pobierz artefakt
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist/

      - name: Symulacja wdrożenia
        run: |
          echo "=== Deploying to production ==="
          echo "App: ${{ env.APP_NAME }}"
          cat dist/build-info.txt
          echo "Deploy completed!"

  status:
    needs: [build, test, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Podsumowanie
        run: |
          echo "================================"
          echo "WYNIKI PIPELINE:"
          echo "Build:  ${{ needs.build.result }}"
          echo "Test:   ${{ needs.test.result }}"
          echo "Deploy: ${{ needs.deploy.result }}"
          echo "================================"
